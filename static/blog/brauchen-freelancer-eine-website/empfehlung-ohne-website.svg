<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-label="Flussdiagramm: Eine Empfehlung führt zur Google-Suche. Mit Website entsteht ein Kontakt, ohne Website geht der potenzielle Kunde verloren.">
  <defs>
    <marker id="eo-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#b0aaa3"/>
    </marker>
    <marker id="eo-arr-copper" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#c17f59"/>
    </marker>
    <marker id="eo-arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#6b6560"/>
    </marker>
  </defs>

  <rect width="780" height="280" fill="#faf8f5" rx="6"/>

  <!-- Step 1: Empfehlung -->
  <rect x="30" y="100" width="130" height="44" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="95" y="116" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Empfehlung</text>
  <text x="95" y="133" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">"Ruf mal X an"</text>

  <!-- Arrow 1 → 2 -->
  <line x1="162" y1="122" x2="198" y2="122" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#eo-arr)"/>

  <!-- Step 2: Google-Suche -->
  <rect x="200" y="100" width="130" height="44" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="265" y="116" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Google-Suche</text>
  <text x="265" y="133" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">"X + Branche + Ort"</text>

  <!-- Branch: Diamond -->
  <polygon points="430,122 490,92 550,122 490,152" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="490" y="118" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">Website</text>
  <text x="490" y="133" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">gefunden?</text>

  <!-- Arrow 2 → Diamond -->
  <line x1="332" y1="122" x2="428" y2="122" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#eo-arr)"/>

  <!-- Upper branch: Ja → Kontakt (copper, success) -->
  <line x1="490" y1="92" x2="490" y2="52" stroke="#c17f59" stroke-width="1.5"/>
  <line x1="490" y1="52" x2="620" y2="52" stroke="#c17f59" stroke-width="1.5" marker-end="url(#eo-arr-copper)"/>
  <text x="550" y="44" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#c17f59" font-weight="600">Ja</text>

  <rect x="622" y="30" width="130" height="44" rx="6" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="687" y="46" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#faf8f5" font-weight="600">Kontakt</text>
  <text x="687" y="63" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#faf8f5">Anfrage kommt</text>

  <!-- Lower branch: Nein → Verloren (muted, failure) -->
  <line x1="490" y1="152" x2="490" y2="192" stroke="#6b6560" stroke-width="1.5"/>
  <line x1="490" y1="192" x2="620" y2="192" stroke="#6b6560" stroke-width="1.5" marker-end="url(#eo-arr-muted)"/>
  <text x="550" y="184" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560" font-weight="600">Nein</text>

  <rect x="622" y="170" width="130" height="44" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="687" y="186" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b6560" font-weight="600">Verloren</text>
  <text x="687" y="203" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#b0aaa3">Du erfährst es nie</text>

  <!-- Legend -->
  <rect x="250" y="248" width="12" height="12" rx="2" fill="#c17f59"/>
  <text x="268" y="258" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Mit Website</text>
  <rect x="380" y="248" width="12" height="12" rx="2" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="398" y="258" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Ohne Website</text>
</svg>