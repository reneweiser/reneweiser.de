<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-label="Drei Vertrauensstatistiken: 46 % beurteilen nach Design, 56 % vertrauen Unternehmen ohne Website nicht, 88 % bevorzugen Unternehmen die auf Bewertungen antworten.">
  <rect width="780" height="240" fill="#faf8f5" rx="6"/>

  <!-- Stat 1: 46 % -->
  <text x="130" y="60" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="42" fill="#c17f59" font-weight="700">46 %</text>
  <text x="130" y="84" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">beurteilen Glaubwürdigkeit</text>
  <text x="130" y="100" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">anhand des Website-Designs</text>
  <!-- Bar -->
  <rect x="40" y="114" width="180" height="6" rx="3" fill="#f0ece5"/>
  <rect x="40" y="114" width="83" height="6" rx="3" fill="#c17f59"/>
  <!-- Source -->
  <text x="130" y="138" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#b0aaa3">Stanford Web Credibility Study</text>

  <!-- Divider -->
  <line x1="260" y1="30" x2="260" y2="150" stroke="#f0ece5" stroke-width="1"/>

  <!-- Stat 2: 56 % -->
  <text x="390" y="60" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="42" fill="#c17f59" font-weight="700">56 %</text>
  <text x="390" y="84" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">vertrauen Unternehmen</text>
  <text x="390" y="100" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">ohne Website nicht</text>
  <!-- Bar -->
  <rect x="300" y="114" width="180" height="6" rx="3" fill="#f0ece5"/>
  <rect x="300" y="114" width="101" height="6" rx="3" fill="#c17f59"/>
  <!-- Source -->
  <text x="390" y="138" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#b0aaa3">Verisign</text>

  <!-- Divider -->
  <line x1="520" y1="30" x2="520" y2="150" stroke="#f0ece5" stroke-width="1"/>

  <!-- Stat 3: 88 % -->
  <text x="650" y="60" text-anchor="middle" font-family="JetBrains Mono, Fira Code, monospace" font-size="42" fill="#c17f59" font-weight="700">88 %</text>
  <text x="650" y="84" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">beauftragen Unternehmen,</text>
  <text x="650" y="100" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">die auf Bewertungen antworten</text>
  <!-- Bar -->
  <rect x="560" y="114" width="180" height="6" rx="3" fill="#f0ece5"/>
  <rect x="560" y="114" width="158" height="6" rx="3" fill="#c17f59"/>
  <!-- Source -->
  <text x="650" y="138" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#b0aaa3">BrightLocal 2024</text>

  <!-- Bottom summary bar -->
  <rect x="30" y="170" width="720" height="44" rx="6" fill="#c17f59" opacity="0.08"/>
  <text x="390" y="190" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#8b5a3c" font-weight="600">Erster Eindruck zählt — und er findet online statt.</text>
  <text x="390" y="206" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Ohne Website fehlt dir die Kontrolle über diesen Moment.</text>
</svg>