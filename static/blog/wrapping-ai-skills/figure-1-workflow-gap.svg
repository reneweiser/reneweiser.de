<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-label="Workflow diagram: A twelve-step content workflow from Strategy to Iterate, with the AI skill only handling the Generate step while the user handles all other steps.">
  <title>The workflow gap — AI handles one step, you handle eleven</title>
  <defs>
    <marker id="wf1-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#b0aaa3"/>
    </marker>
  </defs>

  <rect width="780" height="240" fill="#faf8f5" rx="6"/>

  <!-- Row 1: boxes -->
  <rect x="30" y="40" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="80" y="59" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Strategy</text>

  <rect x="152" y="40" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="202" y="59" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Research</text>

  <rect x="274" y="40" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="324" y="59" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Brief</text>

  <rect x="396" y="40" width="100" height="38" rx="6" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="446" y="59" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#faf8f5" font-weight="600">Generate</text>

  <rect x="518" y="40" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="568" y="59" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Edit</text>

  <rect x="640" y="40" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="690" y="59" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Approve</text>

  <!-- Row 1: arrows -->
  <line x1="132" y1="59" x2="150" y2="59" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="254" y1="59" x2="272" y2="59" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="376" y1="59" x2="394" y2="59" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="498" y1="59" x2="516" y2="59" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="620" y1="59" x2="638" y2="59" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>

  <!-- Connecting path: row 1 end to row 2 start -->
  <path d="M 690,78 L 690,92 Q 690,104 678,104 L 92,104 Q 80,104 80,116 L 80,130" fill="none" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>

  <!-- Row 2: boxes -->
  <rect x="30" y="132" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="80" y="151" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Schedule</text>

  <rect x="152" y="132" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="202" y="151" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Publish</text>

  <rect x="274" y="132" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="324" y="151" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Monitor</text>

  <rect x="396" y="132" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="446" y="151" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Engage</text>

  <rect x="518" y="132" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="568" y="151" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Analyze</text>

  <rect x="640" y="132" width="100" height="38" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="690" y="151" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Iterate</text>

  <!-- Row 2: arrows -->
  <line x1="132" y1="151" x2="150" y2="151" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="254" y1="151" x2="272" y2="151" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="376" y1="151" x2="394" y2="151" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="498" y1="151" x2="516" y2="151" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>
  <line x1="620" y1="151" x2="638" y2="151" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#wf1-arr)"/>

  <!-- Legend -->
  <rect x="230" y="200" width="14" height="14" rx="3" fill="#c17f59"/>
  <text x="252" y="210" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b6560" dominant-baseline="central">What the AI skill does</text>

  <rect x="430" y="200" width="14" height="14" rx="3" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1"/>
  <text x="452" y="210" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b6560" dominant-baseline="central">What the user still handles</text>
</svg>
