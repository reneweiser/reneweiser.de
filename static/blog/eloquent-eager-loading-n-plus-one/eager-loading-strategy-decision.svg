<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 485" role="img" aria-label="Flowchart for choosing between with, withCount, load, and automatic eager loading strategies">
  <defs>
    <marker id="fc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#b0aaa3"/>
    </marker>
  </defs>

  <rect width="780" height="485" fill="#faf8f5" rx="6"/>

  <!-- ==================== Q1: Need the related records? ==================== -->
  <polygon points="540,20 660,60 540,100 420,60" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="540" y="54" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Need the related</text>
  <text x="540" y="70" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">records?</text>

  <!-- Q1 → No → Q2 -->
  <line x1="420" y1="60" x2="340" y2="60" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="380" y="50" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">No</text>

  <!-- Q1 → Yes → Q3 -->
  <line x1="540" y1="100" x2="540" y2="165" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="555" y="135" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Yes</text>

  <!-- ==================== Q2: Need a count or aggregate? ==================== -->
  <polygon points="220,20 340,60 220,100 100,60" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="220" y="54" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Need a count</text>
  <text x="220" y="70" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">or aggregate?</text>

  <!-- Q2 → No → Skip -->
  <line x1="100" y1="60" x2="85" y2="60" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="72" y="50" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">No</text>

  <!-- Result: Skip eager loading -->
  <rect x="10" y="45" width="65" height="30" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="42" y="60" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b6560" font-weight="600">Skip</text>

  <!-- Q2 → Yes → withCount -->
  <line x1="220" y1="100" x2="220" y2="130" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="235" y="118" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Yes</text>

  <!-- Result: withCount() / withSum() -->
  <rect x="145" y="133" width="150" height="34" rx="6" fill="#7d8471" opacity="0.15" stroke="#7d8471" stroke-width="1.5"/>
  <text x="220" y="144" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#5a6350" font-weight="600">withCount()</text>
  <text x="220" y="159" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">withSum() / withAvg()</text>

  <!-- ==================== Q3: Do you control the query? ==================== -->
  <polygon points="540,170 660,210 540,250 420,210" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="540" y="204" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Do you control</text>
  <text x="540" y="220" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">the query?</text>

  <!-- Q3 → Yes → with() -->
  <line x1="420" y1="210" x2="395" y2="210" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="408" y="200" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Yes</text>

  <!-- Result: with() at query time -->
  <rect x="265" y="196" width="120" height="28" rx="6" fill="#7d8471" opacity="0.15" stroke="#7d8471" stroke-width="1.5"/>
  <text x="325" y="210" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#5a6350" font-weight="600">with()</text>

  <!-- Q3 → No → Q4 -->
  <line x1="540" y1="250" x2="540" y2="315" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="555" y="285" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">No</text>

  <!-- ==================== Q4: Collection already loaded? ==================== -->
  <polygon points="540,320 660,360 540,400 420,360" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="540" y="354" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Collection already</text>
  <text x="540" y="370" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">loaded?</text>

  <!-- Q4 → Yes → load() -->
  <line x1="420" y1="360" x2="395" y2="360" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="408" y="350" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Yes</text>

  <!-- Result: load() after retrieval -->
  <rect x="265" y="346" width="120" height="28" rx="6" fill="#7d8471" opacity="0.15" stroke="#7d8471" stroke-width="1.5"/>
  <text x="325" y="360" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="12" fill="#5a6350" font-weight="600">load()</text>

  <!-- Q4 → No → Automatic -->
  <line x1="540" y1="400" x2="540" y2="435" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="555" y="420" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">No</text>

  <!-- Result: Automatic eager loading (primary endpoint) -->
  <rect x="450" y="438" width="180" height="36" rx="6" fill="#7d8471" stroke="#5a6350" stroke-width="1.5"/>
  <text x="540" y="450" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#faf8f5" font-weight="600">Automatic eager loading</text>
  <text x="540" y="466" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#d5e0cf">Laravel 12.8+</text>
</svg>
