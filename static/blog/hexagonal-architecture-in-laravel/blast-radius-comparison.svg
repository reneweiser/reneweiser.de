  <text x="468" y="177" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#6b6560">UseCases/</text>
  <rect x="480" y="186" width="240" height="22" rx="4" fill="#7d8471" opacity="0.15"/>
  <text x="484" y="197" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#7d8471" font-weight="600">GenerateInvoicePdf.php</text>

  <!-- Infrastructure tree -->
  <text x="436" y="227" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#6b6560">Infrastructure/</text>
  <text x="452" y="247" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#6b6560">Billing/</text>
  <rect x="464" y="256" width="240" height="22" rx="4" fill="#7d8471" opacity="0.15"/>
  <text x="468" y="267" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#7d8471" font-weight="600">DompdfGenerator.php</text>
  <text x="468" y="291" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#6b6560">Http/</text>
  <text x="484" y="311" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#6b6560">Controllers/</text>

  <!-- Untouched files -->
  <text x="436" y="341" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#6b6560">Models/</text>
  <text x="436" y="361" font-family="JetBrains Mono, Fira Code, monospace" font-size="11" fill="#6b6560">Providers/</text>

  <!-- Right summary -->
  <rect x="470" y="389" width="230" height="24" rx="6" fill="#7d8471" opacity="0.12"/>
  <text x="585" y="401" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#7d8471" font-weight="600">2 files in 1 domain</text>

  <!-- Legend -->
  <rect x="40" y="30" width="10" height="10" rx="2" fill="#c17f59" opacity="0.3"/>
  <text x="55" y="35" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b6560" dominant-baseline="central">Touched</text>

  <rect x="115" y="30" width="10" height="10" rx="2" fill="#7d8471" opacity="0.3"/>
  <text x="130" y="35" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b6560" dominant-baseline="central">Touched</text>

  <text x="40" y="17" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b6560">Editing invoice PDF generation:</text>
</svg>
