<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-label="Three AI agents working in parallel git worktrees, each scoped to a separate domain directory, merging into main">
  <title>Parallel AI Agents in Git Worktrees — Domain-scoped concurrent development</title>
  <defs>
    <marker id="pa-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#b0aaa3"/>
    </marker>
    <marker id="pa-arr-c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#c17f59"/>
    </marker>
  </defs>

  <rect width="780" height="340" fill="#faf8f5" rx="6"/>

  <!-- Title -->
  <text x="30" y="30" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Parallel AI agents in separate git worktrees</text>

  <!-- Lane 1: Billing -->
  <rect x="30" y="55" width="480" height="70" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>

  <rect x="42" y="63" width="100" height="28" rx="6" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="92" y="77" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#faf8f5" font-weight="600">Agent A</text>

  <text x="155" y="72" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Billing</text>

  <text x="155" y="100" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">app/Domain/Billing/</text>
  <text x="340" y="100" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">app/Infrastructure/Billing/</text>

  <!-- Lane 2: Scheduling -->
  <rect x="30" y="140" width="480" height="70" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>

  <rect x="42" y="148" width="100" height="28" rx="6" fill="#7d8471" stroke="#5e6455" stroke-width="1.5"/>
  <text x="92" y="162" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#faf8f5" font-weight="600">Agent B</text>

  <text x="155" y="157" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Scheduling</text>

  <text x="155" y="185" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">app/Domain/Scheduling/</text>
  <text x="355" y="185" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">app/Infrastructure/Scheduling/</text>

  <!-- Lane 3: Reporting -->
  <rect x="30" y="225" width="480" height="70" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>

  <rect x="42" y="233" width="100" height="28" rx="6" fill="#d5d0c8" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="92" y="247" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">Agent C</text>

  <text x="155" y="242" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Reporting</text>

  <text x="155" y="270" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">app/Domain/Reporting/</text>
  <text x="350" y="270" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">app/Infrastructure/Reporting/</text>

  <!-- Merge target: main branch -->
  <rect x="610" y="130" width="130" height="90" rx="6" fill="#faf8f5" stroke="#c17f59" stroke-width="2"/>
  <text x="675" y="165" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="14" fill="#3d3a37" font-weight="600">main</text>
  <text x="675" y="185" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">merge</text>
  <text x="675" y="205" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">target</text>

  <!-- Arrows from lanes to main -->
  <line x1="512" y1="90" x2="608" y2="155" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#pa-arr)"/>
  <line x1="512" y1="175" x2="608" y2="175" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#pa-arr)"/>
  <line x1="512" y1="260" x2="608" y2="200" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#pa-arr)"/>

  <!-- Footer note -->
  <text x="390" y="320" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">File paths do not overlap between domains — fewer merge conflicts.</text>
</svg>
