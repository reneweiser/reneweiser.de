<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-label="Decision flowchart for choosing between convention-first, middle ground, and hexagonal architecture in Laravel">
  <defs>
    <marker id="fc-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#b0aaa3"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#faf8f5" rx="6"/>

  <!-- Q1: How many domains? -->
  <polygon points="390,30 540,80 390,130 240,80" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="390" y="72" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">How many distinct</text>
  <text x="390" y="90" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">business domains?</text>

  <!-- Q1 -> Convention (left: <4) -->
  <line x1="240" y1="80" x2="120" y2="80" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="180" y="70" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">&lt; 4</text>

  <!-- Result: Convention-first -->
  <rect x="20" y="62" width="100" height="36" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="70" y="80" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">Convention</text>

  <!-- Q1 -> Q2 (down: 4+) -->
  <line x1="390" y1="130" x2="390" y2="170" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="405" y="155" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">4+</text>

  <!-- Q2: Complex business logic? -->
  <polygon points="390,175 540,225 390,275 240,225" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="390" y="217" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Complex business logic</text>
  <text x="390" y="235" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">needing isolated tests?</text>

  <!-- Q2 -> Middle ground (left: No) -->
  <line x1="240" y1="225" x2="120" y2="225" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="180" y="215" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">No</text>

  <!-- Result: Middle ground -->
  <rect x="10" y="204" width="110" height="42" rx="6" fill="#d4a484" opacity="0.2" stroke="#d4a484" stroke-width="1.5"/>
  <text x="65" y="219" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#8b5a3c" font-weight="600">Middle ground</text>
  <text x="65" y="236" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#6b6560">Extract 1 domain</text>

  <!-- Q2 -> Q3 (down: Yes) -->
  <line x1="390" y1="275" x2="390" y2="315" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="405" y="300" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Yes</text>

  <!-- Q3: Multiple devs / AI agents? -->
  <polygon points="390,320 540,370 390,420 240,370" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="390" y="362" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Multiple devs or</text>
  <text x="390" y="380" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">AI agents in parallel?</text>

  <!-- Q3 -> Hex for complex domains (left: No) -->
  <line x1="240" y1="370" x2="120" y2="370" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="180" y="360" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">No</text>

  <!-- Result: Hex for complex domains -->
  <rect x="10" y="349" width="110" height="42" rx="6" fill="#c17f59" opacity="0.15" stroke="#c17f59" stroke-width="1.5"/>
  <text x="65" y="364" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#8b5a3c" font-weight="600">Hexagonal for</text>
  <text x="65" y="380" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#8b5a3c" font-weight="600">complex domains</text>

  <!-- Q3 -> Full hexagonal (down: Yes) -->
  <line x1="390" y1="420" x2="390" y2="455" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#fc-arr)"/>
  <text x="405" y="442" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560">Yes</text>

  <!-- Result: Hexagonal architecture -->
  <rect x="310" y="458" width="160" height="40" rx="6" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="390" y="478" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="13" fill="#faf8f5" font-weight="600">Hexagonal</text>
</svg>
