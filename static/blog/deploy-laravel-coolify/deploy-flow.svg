<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-label="Deploy flow diagram showing the steps from git push to production: push to main, Coolify webhook, Nixpacks build, post-deploy commands, and traffic swap">
  <title>Push-to-Deploy Flow with Coolify</title>

  <defs>
    <marker id="dfl-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#c17f59"/>
    </marker>
    <marker id="dfl-arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#b0aaa3"/>
    </marker>
  </defs>

  <rect width="780" height="360" fill="#faf8f5" rx="6"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="14" fill="#3d3a37" font-weight="600">Push-to-Deploy Flow with Coolify</text>

  <!-- Step 1: Git Push -->
  <rect x="30" y="60" width="120" height="70" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="90" y="86" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Git Push</text>
  <text x="90" y="106" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#6b6560">git push main</text>

  <!-- Arrow 1-2 -->
  <line x1="152" y1="95" x2="178" y2="95" stroke="#c17f59" stroke-width="1.5" marker-end="url(#dfl-arr)"/>

  <!-- Step 2: Webhook -->
  <rect x="180" y="60" width="120" height="70" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="240" y="82" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Coolify</text>
  <text x="240" y="100" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Webhook</text>
  <text x="240" y="118" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#6b6560">triggers build</text>

  <!-- Arrow 2-3 -->
  <line x1="302" y1="95" x2="328" y2="95" stroke="#c17f59" stroke-width="1.5" marker-end="url(#dfl-arr)"/>

  <!-- Step 3: Nixpacks Build -->
  <rect x="330" y="60" width="120" height="70" rx="6" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="390" y="82" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#faf8f5" font-weight="600">Nixpacks</text>
  <text x="390" y="98" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#faf8f5" font-weight="600">Build</text>
  <text x="390" y="118" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#faf8f5">PHP + npm + image</text>

  <!-- Arrow 3-4 -->
  <line x1="452" y1="95" x2="478" y2="95" stroke="#c17f59" stroke-width="1.5" marker-end="url(#dfl-arr)"/>

  <!-- Step 4: Post-deploy -->
  <rect x="480" y="60" width="120" height="70" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="540" y="82" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Post-Deploy</text>
  <text x="540" y="100" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#6b6560">migrate --force</text>
  <text x="540" y="116" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#6b6560">optimize</text>

  <!-- Arrow 4-5 -->
  <line x1="602" y1="95" x2="628" y2="95" stroke="#c17f59" stroke-width="1.5" marker-end="url(#dfl-arr)"/>

  <!-- Step 5: Live -->
  <rect x="630" y="60" width="120" height="70" rx="6" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="690" y="86" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#faf8f5" font-weight="600">Traffic Swap</text>
  <text x="690" y="106" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#faf8f5">new container live</text>

  <!-- Detail boxes below the flow -->

  <!-- Build details -->
  <rect x="80" y="170" width="280" height="140" rx="6" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="220" y="194" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Nixpacks Build Phase</text>
  <line x1="100" y1="206" x2="340" y2="206" stroke="#d5d0c8" stroke-width="1"/>

  <text x="105" y="226" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">1.</text>
  <text x="120" y="226" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37">Install PHP 8.5 + extensions from nixpacks.toml</text>
  <text x="105" y="248" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">2.</text>
  <text x="120" y="248" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37">composer install --no-dev</text>
  <text x="105" y="270" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">3.</text>
  <text x="120" y="270" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37">npm ci &amp;&amp; npm run build (Vite)</text>
  <text x="105" y="292" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">4.</text>
  <text x="120" y="292" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37">Copy Supervisor + Nginx configs</text>

  <!-- Arrow from build phase box to Nixpacks step -->
  <line x1="220" y1="168" x2="390" y2="132" stroke="#b0aaa3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#dfl-arr-g)"/>

  <!-- Rollback details -->
  <rect x="420" y="170" width="320" height="140" rx="6" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="580" y="194" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37" font-weight="600">Safety &amp; Rollback</text>
  <line x1="440" y1="206" x2="720" y2="206" stroke="#d5d0c8" stroke-width="1"/>

  <circle cx="448" cy="228" r="4" fill="#c17f59"/>
  <text x="460" y="228" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" dominant-baseline="central">Old container serves traffic during build</text>

  <circle cx="448" cy="254" r="4" fill="#c17f59"/>
  <text x="460" y="254" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" dominant-baseline="central">If migration fails, deploy aborts</text>

  <circle cx="448" cy="280" r="4" fill="#c17f59"/>
  <text x="460" y="280" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" dominant-baseline="central">Previous container kept as rollback target</text>

  <!-- Arrow from rollback box to Traffic Swap step -->
  <line x1="580" y1="168" x2="690" y2="132" stroke="#b0aaa3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#dfl-arr-g)"/>

  <!-- Legend -->
  <rect x="170" y="328" width="14" height="14" rx="3" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="190" y="335" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560" dominant-baseline="central">Active / key step</text>

  <rect x="310" y="328" width="14" height="14" rx="3" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="330" y="335" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560" dominant-baseline="central">Pipeline step</text>

  <!-- Bottom annotation -->
  <text x="600" y="335" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#b0aaa3" dominant-baseline="central">Total deploy: 1-3 min</text>
</svg>