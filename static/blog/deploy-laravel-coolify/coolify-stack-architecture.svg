<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-label="Architecture diagram showing a VPS running Coolify with Traefik reverse proxy, a Laravel container managed by Supervisor, and MySQL and Redis database containers">
  <title>Coolify + Laravel Stack Architecture on a Single VPS</title>

  <defs>
    <marker id="cs-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#b0aaa3"/>
    </marker>
    <marker id="cs-arr-c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,0.5 L7,3 L1,5.5" fill="#c17f59"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#faf8f5" rx="6"/>

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="14" fill="#3d3a37" font-weight="600">Coolify + Laravel Stack on a Single VPS</text>

  <!-- VPS boundary -->
  <rect x="40" y="50" width="700" height="420" rx="8" fill="none" stroke="#d5d0c8" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="60" y="72" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b6560" font-weight="600">VPS ($5/month)</text>
  <text x="60" y="88" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#b0aaa3">Ubuntu 22.04 / 24.04 LTS</text>

  <!-- Internet / Browser -->
  <rect x="320" y="56" width="140" height="32" rx="6" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="390" y="72" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#3d3a37">Browser / HTTPS</text>

  <!-- Arrow: Browser to Traefik -->
  <line x1="390" y1="90" x2="390" y2="115" stroke="#c17f59" stroke-width="1.5" marker-end="url(#cs-arr-c)"/>

  <!-- Traefik box -->
  <rect x="280" y="118" width="220" height="38" rx="6" fill="#c17f59" stroke="#8b5a3c" stroke-width="1.5"/>
  <text x="390" y="133" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="13" fill="#faf8f5" font-weight="600">Traefik Reverse Proxy</text>
  <text x="390" y="148" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#faf8f5">SSL termination + auto Let's Encrypt</text>

  <!-- Arrow: Traefik to Laravel container -->
  <line x1="390" y1="158" x2="390" y2="188" stroke="#c17f59" stroke-width="1.5" marker-end="url(#cs-arr-c)"/>

  <!-- Coolify managed area -->
  <rect x="60" y="190" width="660" height="260" rx="8" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="80" y="212" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b6560" font-weight="600">Coolify v4 (manages all containers)</text>

  <!-- Laravel container -->
  <rect x="80" y="225" width="380" height="205" rx="6" fill="#faf8f5" stroke="#c17f59" stroke-width="1.5"/>
  <text x="270" y="247" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="13" fill="#3d3a37" font-weight="600">Laravel Container (Nixpacks)</text>

  <!-- Supervisor label -->
  <rect x="110" y="262" width="320" height="24" rx="4" fill="none" stroke="#d5d0c8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="270" y="274" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">supervisord</text>

  <!-- Nginx process -->
  <rect x="100" y="298" width="100" height="50" rx="5" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="150" y="318" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">Nginx</text>
  <text x="150" y="336" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#6b6560">:80</text>

  <!-- PHP-FPM process -->
  <rect x="220" y="298" width="100" height="50" rx="5" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="270" y="318" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">PHP-FPM</text>
  <text x="270" y="336" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#6b6560">PHP 8.5</text>

  <!-- Queue Worker process -->
  <rect x="340" y="298" width="100" height="50" rx="5" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="390" y="314" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">Queue</text>
  <text x="390" y="330" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#3d3a37" font-weight="600">Worker</text>
  <text x="390" y="344" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="9" fill="#6b6560">artisan queue</text>

  <!-- Scheduler note -->
  <rect x="100" y="362" width="340" height="28" rx="5" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1"/>
  <text x="270" y="376" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">cron: php artisan schedule:run (every 1m)</text>

  <!-- Persistent volumes note -->
  <rect x="100" y="398" width="340" height="22" rx="4" fill="none" stroke="#d5d0c8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="270" y="409" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#b0aaa3">Post-deploy: migrate, optimize, storage:link</text>

  <!-- MySQL container -->
  <rect x="490" y="225" width="210" height="95" rx="6" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="595" y="252" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="13" fill="#3d3a37" font-weight="600">MySQL 8.0</text>
  <text x="595" y="272" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">DB_HOST=container-name</text>
  <text x="595" y="290" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">:3306</text>
  <text x="595" y="310" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#b0aaa3">Persistent volume</text>

  <!-- Redis container -->
  <rect x="490" y="335" width="210" height="85" rx="6" fill="#faf8f5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="595" y="362" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="13" fill="#3d3a37" font-weight="600">Redis</text>
  <text x="595" y="382" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">Cache, sessions, queues</text>
  <text x="595" y="400" text-anchor="middle" dominant-baseline="central" font-family="JetBrains Mono, Fira Code, monospace" font-size="10" fill="#6b6560">:6379</text>

  <!-- Arrow: Laravel to MySQL -->
  <line x1="462" y1="280" x2="488" y2="272" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#cs-arr)"/>

  <!-- Arrow: Laravel to Redis -->
  <line x1="462" y1="340" x2="488" y2="365" stroke="#b0aaa3" stroke-width="1.5" marker-end="url(#cs-arr)"/>

  <!-- Docker network label -->
  <text x="530" y="440" text-anchor="middle" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="10" fill="#b0aaa3">Internal Docker network (no external exposure)</text>

  <!-- Legend -->
  <rect x="160" y="488" width="14" height="14" rx="3" fill="#c17f59"/>
  <text x="180" y="495" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560" dominant-baseline="central">Reverse proxy</text>

  <rect x="290" y="488" width="14" height="14" rx="3" fill="none" stroke="#c17f59" stroke-width="1.5"/>
  <text x="310" y="495" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560" dominant-baseline="central">Laravel (Nixpacks)</text>

  <rect x="440" y="488" width="14" height="14" rx="3" fill="#f0ece5" stroke="#d5d0c8" stroke-width="1.5"/>
  <text x="460" y="495" font-family="DM Sans, Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b6560" dominant-baseline="central">Database services</text>
</svg>